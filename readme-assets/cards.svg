<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Accepted cards: Visa, Mastercard, American Express, debit and credit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.33" stop-color="#22e6a8"/>
      <stop offset="0.66" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#b44dff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="visa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f71"/>
      <stop offset="1" stop-color="#3b6cff"/>
    </linearGradient>
    <linearGradient id="mc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="1" stop-color="#3a2a2f"/>
    </linearGradient>
    <linearGradient id="amex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5fd6"/>
      <stop offset="1" stop-color="#2fc4f2"/>
    </linearGradient>
    <linearGradient id="any" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="1" stop-color="#1d2540"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#c79a2b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect x="180" y="28" width="340" height="214" rx="18"/></clipPath>
  </defs>

  <rect width="700" height="300" rx="18" fill="#0a0d14"/>
  <ellipse cx="350" cy="135" rx="300" ry="120" fill="url(#bgGlow)"/>
  <rect x="172" y="20" width="356" height="230" rx="24" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.9"/>

  <!-- CARD 1: VISA -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.25;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 -14;0 -14" keyTimes="0;0.02;0.22;0.25;1" dur="12s" repeatCount="indefinite"/>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#visa)"/>
    <rect x="212" y="84" width="46" height="36" rx="7" fill="url(#chip)"/>
    <path d="M212 102h46M235 84v36" stroke="#8a6a17" stroke-width="1" opacity="0.6"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M284 92a14 14 0 0 1 0 20"/><path d="M292 86a24 24 0 0 1 0 32"/>
    </g>
    <text x="212" y="172" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="20" fill="#fff" letter-spacing="3">•••• •••• •••• ••••</text>
    <text x="212" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#dbe4ff" letter-spacing="1.5">IIBL4Z3MASTERII</text>
    <text x="492" y="222" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-style="italic" font-weight="900" fill="#fff">VISA</text>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#shine)" clip-path="url(#cardClip)"/>
    <text x="350" y="278" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#c9d1d9">Visa</text>
  </g>

  <!-- CARD 2: MASTERCARD -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.5;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 -14;0 -14" keyTimes="0;0.25;0.27;0.47;0.5;1" dur="12s" repeatCount="indefinite"/>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#mc)"/>
    <rect x="212" y="84" width="46" height="36" rx="7" fill="url(#chip)"/>
    <path d="M212 102h46M235 84v36" stroke="#8a6a17" stroke-width="1" opacity="0.6"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M284 92a14 14 0 0 1 0 20"/><path d="M292 86a24 24 0 0 1 0 32"/>
    </g>
    <text x="212" y="172" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="20" fill="#fff" letter-spacing="3">•••• •••• •••• ••••</text>
    <text x="212" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#d0d4dc" letter-spacing="1.5">IIBL4Z3MASTERII</text>
    <circle cx="452" cy="205" r="24" fill="#eb001b"/>
    <circle cx="480" cy="205" r="24" fill="#f79e1b" opacity="0.92"/>
    <path d="M466 187.5a24 24 0 0 1 0 35a24 24 0 0 1 0-35z" fill="#ff5f00"/>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#shine)" clip-path="url(#cardClip)"/>
    <text x="350" y="278" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#c9d1d9">Mastercard</text>
  </g>

  <!-- CARD 3: AMEX -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 -14;0 -14" keyTimes="0;0.5;0.52;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#amex)"/>
    <rect x="212" y="84" width="46" height="36" rx="7" fill="url(#chip)"/>
    <path d="M212 102h46M235 84v36" stroke="#8a6a17" stroke-width="1" opacity="0.6"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
      <path d="M284 92a14 14 0 0 1 0 20"/><path d="M292 86a24 24 0 0 1 0 32"/>
    </g>
    <text x="212" y="172" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="20" fill="#fff" letter-spacing="3">•••• •••••• •••••</text>
    <text x="212" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6f6ff" letter-spacing="1.5">IIBL4Z3MASTERII</text>
    <rect x="410" y="196" width="82" height="34" rx="4" fill="#fff" opacity="0.95"/>
    <text x="451" y="210" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#0b5fd6">AMERICAN</text>
    <text x="451" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#0b5fd6">EXPRESS</text>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#shine)" clip-path="url(#cardClip)"/>
    <text x="350" y="278" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#c9d1d9">American Express</text>
  </g>

  <!-- CARD 4: ANY DEBIT / CREDIT -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.97;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 -14" keyTimes="0;0.75;0.77;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#any)"/>
    <rect x="180" y="28" width="340" height="5" rx="2" fill="url(#ring)" clip-path="url(#cardClip)"/>
    <rect x="212" y="84" width="46" height="36" rx="7" fill="url(#chip)"/>
    <path d="M212 102h46M235 84v36" stroke="#8a6a17" stroke-width="1" opacity="0.6"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M284 92a14 14 0 0 1 0 20"/><path d="M292 86a24 24 0 0 1 0 32"/>
    </g>
    <text x="212" y="172" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="20" fill="#fff" letter-spacing="3">•••• •••• •••• ••••</text>
    <text x="212" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#b9c3e6" letter-spacing="1.5">IIBL4Z3MASTERII</text>
    <text x="492" y="220" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Debit · Credit</text>
    <rect x="180" y="28" width="340" height="214" rx="18" fill="url(#shine)" clip-path="url(#cardClip)"/>
    <text x="350" y="278" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#c9d1d9">Debit &amp; credit cards</text>
  </g>
</svg>
