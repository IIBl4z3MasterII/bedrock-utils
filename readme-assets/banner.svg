<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IIBl4z3MasterII - Minecraft Bedrock Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.25" stop-color="#ffb800"/>
      <stop offset="0.5" stop-color="#22e6a8"/>
      <stop offset="0.75" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#b44dff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rgbFill" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#22e6a8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="2" y="2" width="896" height="236" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="18" fill="#0a0d14"/>
  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#grid)" opacity="0.7"/>
    <ellipse cx="450" cy="120" rx="380" ry="120" fill="url(#glow)"/>

    <!-- floating blocks -->
    <g fill="#58a6ff" opacity="0.5">
      <rect x="80" y="210" width="10" height="10" rx="2"><animate attributeName="y" values="230;-20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="210" y="210" width="6" height="6" rx="1" fill="#22e6a8"><animate attributeName="y" values="230;-20" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="360" y="210" width="8" height="8" rx="2" fill="#b44dff"><animate attributeName="y" values="230;-20" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="560" y="210" width="12" height="12" rx="2" fill="#ffb800"><animate attributeName="y" values="230;-20" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="720" y="210" width="7" height="7" rx="1" fill="#ff2d55"><animate attributeName="y" values="230;-20" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></rect>
      <rect x="820" y="210" width="9" height="9" rx="2" fill="#58a6ff"><animate attributeName="y" values="230;-20" dur="9.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="1.5s" repeatCount="indefinite"/></rect>
    </g>

    <!-- RGB bars -->
    <rect x="0" y="0" width="900" height="4" fill="url(#rgb)"/>
    <rect x="0" y="236" width="900" height="4" fill="url(#rgb)"/>
  </g>

  <rect x="2" y="2" width="896" height="236" rx="16" fill="none" stroke="#222b3a" stroke-width="1.5"/>

  <text x="450" y="112" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="54" font-weight="800" fill="url(#rgbFill)" letter-spacing="1">IIBl4z3MasterII</text>
  <text x="450" y="152" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#c9d1d9">Minecraft Bedrock Developer</text>
  <text x="450" y="184" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="14" fill="#7d8590">Script API  ·  JavaScript  ·  JSON UI  ·  Reusable systems</text>
</svg>
